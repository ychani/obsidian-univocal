name: Verify and release
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Check manifest and tag
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(process.env.GITHUB_REF_NAME) || manifest.version !== process.env.GITHUB_REF_NAME || pkg.version !== manifest.version) {
            throw new Error('Tag, manifest and package version must match.');
          }
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish supported assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_VERSION: ${{ github.ref_name }}
        run: gh release create "$PLUGIN_VERSION" main.js manifest.json styles.css --verify-tag --title "Univocal Read Aloud $PLUGIN_VERSION" --generate-notes
